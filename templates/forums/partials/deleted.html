{# Where the post was, once deleted (an HTMX answer): the notice takes focus. #}
<section id="post" class="panel pj-panel fm-post" aria-labelledby="deleted-title" data-deleted>
  <div class="fm-post-body">
    <h2 id="deleted-title" class="app-heading" tabindex="-1" autofocus>{{ text.DELETED_TITLE }}</h2>
    <p class="app-lede">{{ deleted_text }}</p>
    <div class="app-actions"><a class="btn btn-primary btn-sm" href="{% url 'forums:list' %}">{{ text.BACK }}</a></div>
  </div>
</section>
