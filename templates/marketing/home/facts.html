{# The stat band: Free, Rust, 3 OS, Alpha. #}
<section id="facts" class="mx-auto max-w-[1400px] px-4 py-24 md:px-8 md:py-32" aria-labelledby="facts-title">
  <h2 id="facts-title" class="sr-only">{{ facts.title }}</h2>
  <dl class="grid grid-cols-1 gap-x-6 gap-y-12 sm:grid-cols-2 lg:grid-cols-4">
    {% for stat in facts.stats %}
      <div data-reveal style="--stagger: {{ forloop.counter0 }}">
        <dt class="stat-title display text-5xl text-fg-strong xl:text-7xl">{% include "partials/icon.html" with name=stat.icon size=56 class="motif stat-motif" %}{{ stat.title }}</dt>
        <dd class="mt-3 text-fg-secondary">{{ stat.body }}</dd>
      </div>
    {% endfor %}
  </dl>
</section>
